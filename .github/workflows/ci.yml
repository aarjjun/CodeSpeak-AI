name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check types
        run: npm run check-types
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run unit and accessibility tests with coverage
        run: npm run test:coverage

  extension-host:
    name: Extension Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Extension Host tests on Windows
        if: runner.os == 'Windows'
        run: npm run test:integration
      - name: Run Extension Host tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
